name: Fetch indicator data

on:
  schedule:
    - cron: '0 * * * *' # hourly, on the hour, UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Each indicator below is fetch-then-commit, and every later step uses
      # `if: always()` so one indicator's Open-Meteo hiccup never blocks
      # another's. Each fetch script validates its own output (44 barangays,
      # no null/NaN values) before writing; a bad or partial response makes
      # that step fail and exit non-zero, so the commit step right after it
      # finds no diff and leaves the last good data file in place.
      - name: Run heat index fetch
        run: node scripts/fetch/fetch-heat-index.js

      - name: Commit heat index data if changed
        if: always()
        run: |
          if git diff --quiet -- data/heat-index-latest.json; then
            echo "No change to data/heat-index-latest.json — nothing to commit."
            exit 0
          fi
          git add data/heat-index-latest.json
          git commit -m "chore: update heat index data"
          git push

      - name: Run rainfall fetch
        if: always()
        run: node scripts/fetch/fetch-rainfall.js

      - name: Commit rainfall data if changed
        if: always()
        run: |
          if git diff --quiet -- data/rainfall-latest.json; then
            echo "No change to data/rainfall-latest.json — nothing to commit."
            exit 0
          fi
          git add data/rainfall-latest.json
          git commit -m "chore: update rainfall data"
          git push
